<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vroom - Covoiturage</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <section class="top-page">
        <header class="header">
            <img src="images/vroom logo sans fond.png" alt="Logo du site">
            <nav class = "nav">
                <li>Accueil</li>
                <li>Nos trajets quotidiens</li>
                <li>Nos abonnements</li>
            </nav>

        </header>
        <div class="landing-page">
            <h1 class ="big-title">Voyagez ensemble, économisez et protégez la planète.</h1>
            <a href="">Scroll</a>
            <section class="search-trips">
                <div class="search-item">
                    <img src="images/Date.png" alt="Date de départ">
                    <input type="date" placeholder="Date de départ">
                </div>
                <div class="search-item">
                    <img src="images/position.png" alt="Lieu de départ">
                    <input type="text" placeholder="Lieu de départ">
                </div>
                <div class="search-item">
                    <img src="images/position.png" alt="Lieu d'arrivée">
                    <input type="text" placeholder="Lieu d'arrivée">
                </div>
                <div class="search-item">
                    <img src="images/nombre de personnes.png" alt="Nombre de personnes">
                    <input type="number" min="1" placeholder="Nombre de personnes">
                </div>
                <button class="search-button">Rechercher</button>
            </section>
        </div>

    </section>
</body>
</html>
