<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="stylesheet" href="css/page_login.css">
</head>
<body>
    <div class ="logo_position"><img src="image/vroom_logo_sans_fond.png" alt="Logo Vroom"></div>
    <div class="pos">
        <div>
            <h2>Bienvenue sur VROOM</h2>
            <h3>Connectez-vous pour continuer voterr voyage écologique</h3><br> 
        </div>
        <div class="form_position">
            <form action=# method=#>
                <div>
                    <label for="email">Email</label><br>

                    <input type="text" id="password" name="password" required><br><br>
                    <button type="submit">Se connecter</button>
                </div>
            </form>
        </div>
    </div>
        
</body>
